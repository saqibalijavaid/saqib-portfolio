<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Apply the saved/system theme before first paint so prerendered HTML does
      not flash light-mode content at dark-mode visitors.
      Mirrors the logic in src/context/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {
          /* localStorage unavailable — fall through to default styling */
        }
      })();
    </script>

    <!-- SEO:START — replaced per route at build time by scripts/prerender.mjs -->
