    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Apply the saved/system theme before first paint so prerendered HTML does
      not flash light-mode content at dark-mode visitors.
      Mirrors the logic in src/context/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {
          /* localStorage unavailable — fall through to default styling */
        }
      })();
    </script>

    <!--

      src/seo/pages.json instead of editing it here — the build overwrites it.

      What must stay in sync here is the SET of tags: SeoSync.tsx mutates
      existing elements on client-side navigation and silently skips any that
      do not exist, so a tag missing from this template is a tag that never
      updates when a visitor navigates.

      The marker below is matched literally by the build. Do not reword it.
    -->
